name: Build iOS App & IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis and tests
        run: |
          flutter analyze
          flutter test

      - name: Build iOS Application (Release)
        run: |
          flutter build ios --release --no-codesign

      - name: Build unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Channel_GCC_Report.ipa Payload/
          rm -rf Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Channel_GCC_Report_iOS_IPA
          path: Channel_GCC_Report.ipa
